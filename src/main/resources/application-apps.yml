# Homelab apps server (Coolify + docker-compose Postgres).
# Activate with SPRING_PROFILES_ACTIVE=apps (set in docker-compose.yml).
#
# Environment (Coolify / compose):
#   PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD
#   PORT (default 8080)
spring:
  main:
    lazy-initialization: true
  datasource:
    url: jdbc:postgresql://${PGHOST:db}:${PGPORT:5432}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000
      keepalive-time: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  address: 0.0.0.0
  port: ${PORT:8080}

app:
  cors:
    origins: "*"
